# ========================
# NEWIFI3 极速版（无广告）
# ========================

# ========================
# 规则部分（只有 5 条）
# ========================

# 本地网络直连
ruleset=全球直连,[]GEOSITE,private,no-resolve

# AI 服务
ruleset=节点选择,[]GEOSITE,category-ai-chat-!cn

# Telegram
ruleset=节点选择,[]GEOSITE,telegram

# 中国大陆直连
ruleset=全球直连,[]GEOSITE,cn
ruleset=全球直连,[]GEOIP,cn,no-resolve

# 国际流量
ruleset=节点选择,[]GEOSITE,geolocation-!cn

# 兜底
ruleset=漏网之鱼,[]FINAL

# ========================
# 策略组（只有 4 个）
# ========================

custom_proxy_group=节点选择`select`[]自动选择`[]故障转移`[]DIRECT`.*
custom_proxy_group=自动选择`url-test`.*`https://www.cloudflare.com/cdn-cgi/trace`600,5,50
custom_proxy_group=故障转移`fallback`.*`https://www.cloudflare.com/cdn-cgi/trace`600,5,50
custom_proxy_group=全球直连`select`[]DIRECT`[]节点选择
custom_proxy_group=漏网之鱼`select`[]DIRECT`[]节点选择

# ========================
# 设置
# ========================
enable_rule_generator=true
overwrite_original_rules=true
