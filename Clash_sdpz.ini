# ========================
# Clash / Mihomo 极简省电版 v1.3
# 适用于 Hako Clash、Nikki、Clash Verge 等 Mihomo 客户端
# APNs 独立分流 / Telegram 香港 / IPv6 / 极简省电
# ========================

# ========================
# 规则部分
# ========================

# --- 本地网络与个人域名 ---
ruleset=全球直连,[]DOMAIN-SUFFIX,300111.xyz
ruleset=全球直连,[]GEOSITE,private
ruleset=全球直连,[]GEOIP,private,no-resolve

# --- DNS 分流 ---
ruleset=全球直连,[]IP-CIDR,223.5.5.5/32,no-resolve
ruleset=全球直连,[]IP-CIDR,211.138.240.100/32,no-resolve
ruleset=全球直连,[]IP-CIDR,211.138.245.180/32,no-resolve
ruleset=全球直连,[]DOMAIN-SUFFIX,alidns.com
ruleset=节点选择,[]IP-CIDR,8.8.8.8/32,no-resolve
ruleset=节点选择,[]IP-CIDR,8.8.4.4/32,no-resolve
ruleset=节点选择,[]IP-CIDR6,2001:4860:4860::8888/128,no-resolve
ruleset=节点选择,[]IP-CIDR6,2001:4860:4860::8844/128,no-resolve
ruleset=节点选择,[]DOMAIN-SUFFIX,dns.google

# --- 广告 ---
ruleset=广告拦截,[]GEOSITE,category-ads-all

# --- AI ---
ruleset=ChatGPT,[]GEOSITE,category-ai-chat-!cn

# --- Telegram ---
ruleset=电报消息,[]GEOSITE,telegram
ruleset=电报消息,[]GEOIP,telegram,no-resolve

# --- YouTube ---
ruleset=油管视频,[]GEOSITE,youtube

# --- Netflix ---
ruleset=奈飞视频,[]GEOSITE,netflix
ruleset=奈飞视频,[]GEOIP,netflix,no-resolve

# --- 社交媒体 ---
ruleset=社交媒体,[]GEOSITE,facebook
ruleset=社交媒体,[]GEOSITE,instagram
ruleset=社交媒体,[]GEOSITE,tiktok

# --- Apple APNs 推送 ---
ruleset=苹果推送,[]DOMAIN,identity.apple.com
ruleset=苹果推送,[]DOMAIN-SUFFIX,push.apple.com
ruleset=苹果推送,[]DOMAIN-SUFFIX,akadns.net
ruleset=苹果推送,[]DOMAIN-KEYWORD,apple.com.edgekey.net
ruleset=苹果推送,[]IP-CIDR,17.249.0.0/16,no-resolve
ruleset=苹果推送,[]IP-CIDR,17.252.0.0/16,no-resolve
ruleset=苹果推送,[]IP-CIDR,17.57.144.0/22,no-resolve
ruleset=苹果推送,[]IP-CIDR,17.188.128.0/18,no-resolve
ruleset=苹果推送,[]IP-CIDR,17.188.20.0/23,no-resolve
ruleset=苹果推送,[]IP-CIDR6,2620:149:a44::/48,no-resolve
ruleset=苹果推送,[]IP-CIDR6,2403:300:a42::/48,no-resolve
ruleset=苹果推送,[]IP-CIDR6,2403:300:a51::/48,no-resolve
ruleset=苹果推送,[]IP-CIDR6,2a01:b740:a42::/48,no-resolve

# --- Google / Apple ---
ruleset=节点选择,[]GEOSITE,google
ruleset=苹果服务,[]GEOSITE,apple

# --- 中国大陆直连 ---
ruleset=全球直连,[]GEOSITE,cn
ruleset=全球直连,[]GEOIP,cn,no-resolve

# --- 未命中流量 ---
ruleset=漏网之鱼,[]FINAL

# ========================
# 策略组
# ========================

custom_proxy_group=节点选择`select`[]香港负载`[]台湾负载`[]jj`[]去广告`[]DIRECT`.*`[]手动选择
custom_proxy_group=油管视频`select`[]去广告`[]台湾负载`[]香港负载`[]节点选择`[]手动选择
custom_proxy_group=ChatGPT`select`[]台湾负载`[]jj`[]香港负载`[]节点选择`[]手动选择
custom_proxy_group=社交媒体`select`[]jj`[]台湾负载`[]香港负载`[]节点选择`[]手动选择
custom_proxy_group=电报消息`select`[]香港负载`[]jj`[]台湾负载`[]去广告`[]节点选择`[]手动选择
custom_proxy_group=奈飞视频`select`[]台湾负载`[]jj`[]香港负载`[]节点选择`[]手动选择
custom_proxy_group=苹果推送`select`[]香港负载`[]jj`[]台湾负载`[]节点选择`[]DIRECT
custom_proxy_group=手动选择`select`.*

# --- 自动测速组 ---
custom_proxy_group=香港负载`url-test`(电视)`http://cp.cloudflare.com/generate_204`480,5,50
custom_proxy_group=台湾负载`url-test`(台湾)`http://cp.cloudflare.com/generate_204`480,5,50
custom_proxy_group=jj`url-test`(jj)`http://cp.cloudflare.com/generate_204`480,5,50
custom_proxy_group=去广告`url-test`(去广告)`http://cp.cloudflare.com/generate_204`480,5,50

# --- 系统组 ---
custom_proxy_group=苹果服务`select`[]DIRECT`[]节点选择
custom_proxy_group=广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=全球直连`select`[]DIRECT`[]节点选择
custom_proxy_group=漏网之鱼`select`[]节点选择`[]DIRECT

# ========================
# 规则生成器
# ========================

enable_rule_generator=true
overwrite_original_rules=true
