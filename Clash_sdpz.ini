# ========================
# Clash / Mihomo 极简省电版 v1.3 · 图标版
# 适用于 Hako Clash、Nikki、Clash Verge 等 Mihomo 客户端
#
# v1.3 更新：
# 1. Apple APNs 独立「苹果推送」策略组
# 2. 苹果推送默认：香港负载
# 3. Telegram 默认：jj
# 4. 普通 Apple 服务默认：DIRECT
# 5. 增加 uhovohu/clash 策略组图标
# 6. 推荐搭配 Zashboard
# ========================


# ========================
# 规则部分
# ========================

# --- 本地网络与个人域名 ---

ruleset=全球直连,[]DOMAIN-SUFFIX,300111.xyz
ruleset=全球直连,[]GEOSITE,private
ruleset=全球直连,[]GEOIP,private,no-resolve


# ========================
# DNS 分流
# ========================

# 国内 DNS 直连
ruleset=全球直连,[]IP-CIDR,223.5.5.5/32,no-resolve
ruleset=全球直连,[]IP-CIDR,211.138.240.100/32,no-resolve
ruleset=全球直连,[]IP-CIDR,211.138.245.180/32,no-resolve
ruleset=全球直连,[]DOMAIN-SUFFIX,alidns.com

# Google DNS 代理
ruleset=节点选择,[]IP-CIDR,8.8.8.8/32,no-resolve
ruleset=节点选择,[]IP-CIDR,8.8.4.4/32,no-resolve
ruleset=节点选择,[]IP-CIDR6,2001:4860:4860::8888/128,no-resolve
ruleset=节点选择,[]IP-CIDR6,2001:4860:4860::8844/128,no-resolve
ruleset=节点选择,[]DOMAIN-SUFFIX,dns.google


# ========================
# 广告
# ========================

ruleset=广告拦截,[]GEOSITE,category-ads-all


# ========================
# AI
# ========================

ruleset=ChatGPT,[]GEOSITE,category-ai-chat-!cn


# ========================
# Telegram
# ========================

ruleset=电报消息,[]GEOSITE,telegram
ruleset=电报消息,[]GEOIP,telegram,no-resolve


# ========================
# YouTube
# ========================

ruleset=油管视频,[]GEOSITE,youtube


# ========================
# 社交媒体
# Facebook / Instagram / TikTok
# ========================

ruleset=社交媒体,[]GEOSITE,facebook
ruleset=社交媒体,[]GEOSITE,instagram
ruleset=社交媒体,[]GEOSITE,tiktok


# ==========================================================
# Apple APNs 推送
# 必须放在 GEOSITE,apple 和 CN 规则之前
# ==========================================================

# --- Apple 身份认证 / Push / CDN ---

ruleset=苹果推送,[]DOMAIN,identity.apple.com
ruleset=苹果推送,[]DOMAIN-SUFFIX,push.apple.com
ruleset=苹果推送,[]DOMAIN-SUFFIX,akadns.net
ruleset=苹果推送,[]DOMAIN-KEYWORD,apple.com.edgekey.net


# --- Apple APNs IPv4 ---

ruleset=苹果推送,[]IP-CIDR,17.249.0.0/16,no-resolve
ruleset=苹果推送,[]IP-CIDR,17.252.0.0/16,no-resolve
ruleset=苹果推送,[]IP-CIDR,17.57.144.0/22,no-resolve
ruleset=苹果推送,[]IP-CIDR,17.188.128.0/18,no-resolve
ruleset=苹果推送,[]IP-CIDR,17.188.20.0/23,no-resolve


# --- Apple APNs IPv6 ---

ruleset=苹果推送,[]IP-CIDR6,2620:149:a44::/48,no-resolve
ruleset=苹果推送,[]IP-CIDR6,2403:300:a42::/48,no-resolve
ruleset=苹果推送,[]IP-CIDR6,2403:300:a51::/48,no-resolve
ruleset=苹果推送,[]IP-CIDR6,2a01:b740:a42::/48,no-resolve


# ========================
# Google
# ========================

ruleset=节点选择,[]GEOSITE,google


# ========================
# 普通 Apple 服务
# APNs 已经在上面优先匹配
# 其余 Apple 默认 DIRECT
# ========================

ruleset=苹果服务,[]GEOSITE,apple


# ========================
# 中国大陆直连
# 微信 / QQ / 淘宝 / 支付宝等
# ========================

ruleset=全球直连,[]GEOSITE,cn
ruleset=全球直连,[]GEOIP,cn,no-resolve


# ========================
# 未命中流量
# ========================

ruleset=漏网之鱼,[]FINAL



# ==========================================================
# 策略组部分
# ==========================================================


# ========================
# 主节点选择
# ========================

custom_proxy_group=节点选择`select`[]香港负载`[]台湾负载`[]jj`[]去广告`[]DIRECT`.*`[]手动选择`https://raw.githubusercontent.com/uhovohu/clash/main/icons/proxy.png


# ========================
# YouTube
# ========================

custom_proxy_group=油管视频`select`[]去广告`[]台湾负载`[]香港负载`[]节点选择`[]手动选择`https://raw.githubusercontent.com/uhovohu/clash/main/icons/youtube.png


# ========================
# ChatGPT
# ========================

custom_proxy_group=ChatGPT`select`[]台湾负载`[]jj`[]香港负载`[]节点选择`[]手动选择`https://raw.githubusercontent.com/uhovohu/clash/main/icons/chatgpt.png


# ========================
# 社交媒体
# ========================

custom_proxy_group=社交媒体`select`[]jj`[]台湾负载`[]香港负载`[]节点选择`[]手动选择`https://raw.githubusercontent.com/uhovohu/clash/main/icons/tiktok.png


# ========================
# Telegram
#
# Telegram 本体默认 jj
# APNs 推送不走这里
# ========================

custom_proxy_group=电报消息`select`[]jj`[]香港负载`[]台湾负载`[]去广告`[]节点选择`[]手动选择`https://raw.githubusercontent.com/uhovohu/clash/main/icons/telegram.png


# ========================
# Apple APNs 推送
#
# 默认第一项：香港负载
# Telegram / 微信 / QQ 等 iOS 推送均可使用此 APNs 通道
# ========================

custom_proxy_group=苹果推送`select`[]香港负载`[]jj`[]台湾负载`[]节点选择`[]DIRECT`https://raw.githubusercontent.com/uhovohu/clash/main/icons/apple.png


# ========================
# 手动选择
# ========================

custom_proxy_group=手动选择`select`.*`https://raw.githubusercontent.com/uhovohu/clash/main/icons/select.png



# ==========================================================
# 自动测速组
# ==========================================================

# ========================
# 香港负载
# ========================

custom_proxy_group=香港负载`url-test`(电视)`http://cp.cloudflare.com/generate_204`480,5,50`https://raw.githubusercontent.com/uhovohu/clash/main/icons/hongkong.png


# ========================
# 台湾负载
# ========================

custom_proxy_group=台湾负载`url-test`(台湾)`http://cp.cloudflare.com/generate_204`480,5,50`https://raw.githubusercontent.com/uhovohu/clash/main/icons/taiwan.png


# ========================
# jj
# ========================

custom_proxy_group=jj`url-test`(jj)`http://cp.cloudflare.com/generate_204`480,5,50`https://raw.githubusercontent.com/uhovohu/clash/main/icons/singapore.png


# ========================
# 去广告节点
# ========================

custom_proxy_group=去广告`url-test`(去广告)`http://cp.cloudflare.com/generate_204`480,5,50`https://raw.githubusercontent.com/uhovohu/clash/main/icons/adblock.png



# ==========================================================
# 系统组
# ==========================================================


# ========================
# 普通 Apple
# 默认 DIRECT
# ========================

custom_proxy_group=苹果服务`select`[]DIRECT`[]节点选择`https://raw.githubusercontent.com/uhovohu/clash/main/icons/apple.png


# ========================
# 广告拦截
# ========================

custom_proxy_group=广告拦截`select`[]REJECT`[]DIRECT`https://raw.githubusercontent.com/uhovohu/clash/main/icons/adblock.png


# ========================
# 全球直连
# ========================

custom_proxy_group=全球直连`select`[]DIRECT`[]节点选择`https://raw.githubusercontent.com/uhovohu/clash/main/icons/direct.png


# ========================
# 漏网之鱼
# ========================

custom_proxy_group=漏网之鱼`select`[]节点选择`[]DIRECT`https://raw.githubusercontent.com/uhovohu/clash/main/icons/final.png



# ==========================================================
# 规则生成器
# ==========================================================

enable_rule_generator=true
overwrite_original_rules=true
