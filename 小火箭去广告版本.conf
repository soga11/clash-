# ============================================================
# 第 3 优先级：苹果服务分流 (双重备份)
# ============================================================
# ★ loganoxo 优先
RULE-SET,https://raw.githubusercontent.com/loganoxo/thisrule/refs/heads/master/rule/Apple/Shadowrocket/Apple.list,DIRECT

# ============================================================
# 第 4 优先级：AI 服务 (双重备份，确保覆盖)
