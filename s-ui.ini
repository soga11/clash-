;;=========================================================
;; MiSub / subconverter 外部配置
;; 引用：MiSub → 服务集成 → 模板配置 → 本文件的 raw 链接
;;
;; 节点命名依据（你的机场备注名）：
;;   香港电视 / wawo / 新加坡 / aws香港hy2 / aws台湾hy2 / 东京 / 洛杉矶
;; 机场改名后只改下面 url-test 组的正则即可
;;=========================================================

[custom]

;;----------------- 基础配置骨架 -----------------
;; 把下面两处 <你的用户名>/<仓库名> 换成你自己的
;; 若后端不支持 singbox_rule_base，这行会被忽略，不影响其余部分
singbox_rule_base=https://raw.githubusercontent.com/<你的用户名>/<仓库名>/main/singbox_base.json

;;----------------- 节点过滤 -----------------
;; 剔除机场的信息节点（到期时间、剩余流量、官网入口这类假节点）
;; 它们会污染「自动选择」组并白耗测速请求
exclude_remarks=(?i)(到期|剩余|流量|官网|订阅|重置|expire|traffic|reset|website|按量)

;;----------------- 策略组 -----------------
custom_proxy_group=节点选择`select`[]香港负载`[]自动选择`[]AWS香港负载`[]AWS台湾负载`[]wawo`[]新加坡负载`[]美国负载`[]AWS东京负载`[]DIRECT
custom_proxy_group=油管视频`select`[]wawo`[]美国负载`[]AWS东京负载`[]AWS香港负载`[]AWS台湾负载`[]节点选择`[]新加坡负载`[]DIRECT
custom_proxy_group=香港流媒体`select`[]香港负载`[]wawo`[]AWS香港负载`[]节点选择`[]DIRECT
custom_proxy_group=ChatGPT`select`[]AWS台湾负载`[]美国负载`[]AWS东京负载`[]香港负载`[]新加坡负载`[]节点选择`[]自动选择`[]DIRECT
custom_proxy_group=TikTok`select`[]AWS台湾负载`[]美国负载`[]新加坡负载`[]节点选择`[]AWS东京负载`[]DIRECT
custom_proxy_group=奈飞视频`select`[]AWS台湾负载`[]新加坡负载`[]节点选择`[]美国负载`[]DIRECT
custom_proxy_group=电报消息`select`[]香港负载`[]新加坡负载`[]wawo`[]AWS香港负载`[]节点选择`[]自动选择`[]DIRECT
custom_proxy_group=苹果服务`select`[]DIRECT`[]节点选择`[]自动选择
custom_proxy_group=广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=漏网之鱼`select`[]节点选择`[]DIRECT`[]自动选择

;; 地区组统一用 url-test 而不是 load-balance：sing-box 内核没有
;; load-balance 类型，用它会导致转 sing-box 时这些组失效或被丢弃。
;; 单地区两三个节点的场景下，两者实际效果差别很小。
custom_proxy_group=自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=香港负载`url-test`(?i)(香港电视)`http://www.gstatic.com/generate_204`600,,50
custom_proxy_group=wawo`url-test`(?i)(wawo)`http://www.gstatic.com/generate_204`600,,50
custom_proxy_group=新加坡负载`url-test`(?i)(新加坡)`http://www.gstatic.com/generate_204`600,,50
custom_proxy_group=AWS香港负载`url-test`(?i)(aws香港hy2)`http://www.gstatic.com/generate_204`600,,50
custom_proxy_group=AWS台湾负载`url-test`(?i)(aws台湾hy2)`http://www.gstatic.com/generate_204`600,,50
custom_proxy_group=AWS东京负载`url-test`(?i)(东京)`http://www.gstatic.com/generate_204`600,,50
custom_proxy_group=美国负载`url-test`(?i)(洛杉矶)`http://www.gstatic.com/generate_204`600,,50

;;----------------- 分流规则 -----------------
enable_rule_generator=true
overwrite_original_rules=true

;; 第0 个人强制直连（机场订阅域名必须在最前，防「更新订阅要先连代理」死锁）
ruleset=DIRECT,[]DOMAIN-SUFFIX,nn.300111.xyz
ruleset=DIRECT,[]DOMAIN-SUFFIX,goofish.com

;; 第1 局域网
ruleset=DIRECT,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.list

;; 第2 广告 + HTTPDNS
;; BlockHttpDNS 必须留：国内 App 走 HTTPDNS 会整体绕过下面所有规则
ruleset=广告拦截,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/BlockHttpDNS/BlockHttpDNS.list
ruleset=广告拦截,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Advertising/Advertising.list
ruleset=广告拦截,[]DOMAIN-SUFFIX,mcdn.bilivideo.com
ruleset=广告拦截,[]DOMAIN-SUFFIX,mcdn.bilivideo.cn
ruleset=广告拦截,[]DOMAIN-SUFFIX,szbdyd.com
ruleset=广告拦截,[]DOMAIN-SUFFIX,mountaintoys.cn

;; 第2.5 .cn 全量直连
;; 位置必须在广告之后 —— mcdn.bilivideo.cn、mountaintoys.cn 本身是 .cn
;; 广告域名，放前面会把拦截绕过去
ruleset=DIRECT,[]DOMAIN-SUFFIX,cn

;; 第3 AI
ruleset=ChatGPT,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=ChatGPT,[]DOMAIN-SUFFIX,claude.ai
ruleset=ChatGPT,[]DOMAIN-SUFFIX,anthropic.com
ruleset=ChatGPT,[]DOMAIN-SUFFIX,gemini.google.com
ruleset=ChatGPT,[]DOMAIN-SUFFIX,aistudio.google.com
ruleset=ChatGPT,[]DOMAIN-SUFFIX,generativelanguage.googleapis.com
ruleset=ChatGPT,[]DOMAIN-SUFFIX,grok.com
ruleset=ChatGPT,[]DOMAIN-SUFFIX,x.ai
ruleset=ChatGPT,[]DOMAIN-SUFFIX,perplexity.ai

;; 第3 YouTube
ruleset=油管视频,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list
ruleset=油管视频,[]DOMAIN-SUFFIX,youtu.be
ruleset=油管视频,[]DOMAIN-SUFFIX,googlevideo.com

;; 第3 Apple —— 推送硬保护必须在 Apple 规则集之前，
;; 否则把「苹果服务」组切到节点时会连推送一起代理，可能掉通知
ruleset=DIRECT,[]DOMAIN-SUFFIX,push.apple.com
ruleset=苹果服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Apple/Apple.list

;; 第3 其余国际应用
ruleset=节点选择,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.list
ruleset=电报消息,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list
ruleset=奈飞视频,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list
ruleset=奈飞视频,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Disney/Disney.list
ruleset=奈飞视频,[]DOMAIN-SUFFIX,hulu.com
ruleset=奈飞视频,[]DOMAIN-SUFFIX,primevideo.com
ruleset=TikTok,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.list
ruleset=节点选择,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list

;; 第3 香港流媒体
ruleset=香港流媒体,[]DOMAIN-SUFFIX,tvb.com
ruleset=香港流媒体,[]DOMAIN-SUFFIX,tvbanywhere.com
ruleset=香港流媒体,[]DOMAIN-SUFFIX,mytvsuper.com
ruleset=香港流媒体,[]DOMAIN-SUFFIX,viu.com
ruleset=香港流媒体,[]DOMAIN-SUFFIX,viutv.com
ruleset=香港流媒体,[]DOMAIN-SUFFIX,hktvmall.com
ruleset=香港流媒体,[]DOMAIN-KEYWORD,nowtv100
ruleset=香港流媒体,[]DOMAIN-KEYWORD,rthklive

;; 第5 中国大陆域名
ruleset=DIRECT,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax.list

;; 第6 境外兜底
ruleset=节点选择,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Global/Global.list

;; 第7 IP 层兜底
ruleset=DIRECT,[]GEOIP,CN

;; 第8 最终兜底
ruleset=漏网之鱼,[]FINAL
