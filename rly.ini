# 规则部分（优化版：整合 MetaCubeX 高质量规则集）
# ========================

# === 第 0 优先级：本地网络直连 ===
# 使用 MetaCubeX 私有域名规则集，更全面、更及时
ruleset=全球直连,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs

# === 第 1 优先级：DNS 分流 ===
# 将明确的DNS服务器流量导向正确策略，保障解析准确性和速度。
ruleset=全球直连,[]IP-CIDR,114.114.114.114/32,no-resolve
ruleset=全球直连,[]IP-CIDR,223.5.5.5/32,no-resolve
ruleset=全球直连,[]IP-CIDR,119.29.29.29/32,no-resolve
ruleset=全球直连,[]IP-CIDR,180.76.76.76/32,no-resolve
ruleset=全球直连,[]DOMAIN-SUFFIX,dns.pub
ruleset=全球直连,[]DOMAIN-SUFFIX,doh.pub
ruleset=全球直连,[]DOMAIN-SUFFIX,alidns.com

ruleset=节点选择,[]IP-CIDR,1.1.1.1/32,no-resolve
ruleset=节点选择,[]IP-CIDR,1.0.0.1/32,no-resolve
ruleset=节点选择,[]IP-CIDR,8.8.8.8/32,no-resolve
ruleset=节点选择,[]IP-CIDR,8.8.4.4/32,no-resolve
ruleset=节点选择,[]IP-CIDR6,2606:4700:4700::1111/128,no-resolve
ruleset=节点选择,[]IP-CIDR6,2606:4700:4700::1001/128,no-resolve
ruleset=节点选择,[]IP-CIDR6,2001:4860:4860::8888/128,no-resolve
ruleset=节点选择,[]IP-CIDR6,2001:4860:4860::8844/128,no-resolve
ruleset=节点选择,[]DOMAIN-SUFFIX,cloudflare-dns.com
ruleset=节点选择,[]DOMAIN-SUFFIX,dns.google
ruleset=节点选择,[]DOMAIN-SUFFIX,quad9.net

# === 第 2 优先级：广告拦截 ===
# 使用多份高效列表，覆盖域名、关键词和IP，显著提升拦截能力。
ruleset=广告拦截,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanAD.list
ruleset=广告拦截,https://cdn.jsdelivr.net/gh/Cats-Team/AdRules@main/adrules_domainset.txt
ruleset=广告拦截,https://cdn.jsdelivr.net/gh/privacy-protection-tools/anti-AD/master/anti-ad-domains.txt
ruleset=广告拦截,https://raw.githubusercontent.com/neo-egg/neoegg-clash/main/Ruleset/AdGuard-DNS.txt
ruleset=广告拦截,[]GEOSITE,category-ads-all

# === 第 3 优先级：核心国际应用分流 ===
# 此部分处理需要明确、优先代理的国际服务。
# 使用 MetaCubeX 的高精度规则集，确保覆盖全面、更新及时。

# AI 服务（使用权威 Geosite 规则集）
ruleset=ChatGPT,https://raw.githubusercontent.com/loganoxo/thisrule/refs/heads/master/rule/AI/Clash/AI.list
ruleset=ChatGPT,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-chat-!cn.mrs

# Telegram（使用权威 Geosite + GeoIP 规则集）
ruleset=电报消息,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.mrs
ruleset=电报消息,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.mrs,no-resolve

# YouTube（使用权威 Geosite 规则集）
ruleset=油管视频,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs

