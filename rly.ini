# ========================
# Clash 配置文件 v4（精简优化版）
# 基于 v3：广告源去重、规则去冗余、修正测速参数
# ========================

# ========================
# 规则部分
# ========================

# --- 第 0 优先级：本地网络 + 强制直连 ---
# 注意：如果你的机场订阅域名命中了后面的 LoganProxy（内含机场官网列表），
# 会出现"更新订阅要先连代理、连代理要先更新订阅"的死锁，把域名加到这里。
ruleset=全球直连,[]DOMAIN-SUFFIX,nn.300111.xyz
ruleset=全球直连,https://raw.githubusercontent.com/loganoxo/thisrule/refs/heads/master/rule/Lan/Clash/Lan.list

# --- 第 1 优先级：DNS 分流 ---
# 国内 DNS
ruleset=全球直连,[]IP-CIDR,114.114.114.114/32,no-resolve
ruleset=全球直连,[]IP-CIDR,223.5.5.5/32,no-resolve
ruleset=全球直连,[]IP-CIDR,119.29.29.29/32,no-resolve
ruleset=全球直连,[]IP-CIDR,180.76.76.76/32,no-resolve
ruleset=全球直连,[]IP-CIDR6,2400:3200::1/128,no-resolve
ruleset=全球直连,[]IP-CIDR6,2402:4e00::/128,no-resolve
ruleset=全球直连,[]DOMAIN-SUFFIX,dns.pub
ruleset=全球直连,[]DOMAIN-SUFFIX,doh.pub
ruleset=全球直连,[]DOMAIN-SUFFIX,alidns.com

# 国际 DNS
ruleset=节点选择,[]IP-CIDR,1.1.1.1/32,no-resolve
ruleset=节点选择,[]IP-CIDR,1.0.0.1/32,no-resolve
ruleset=节点选择,[]IP-CIDR,8.8.8.8/32,no-resolve
ruleset=节点选择,[]IP-CIDR,8.8.4.4/32,no-resolve
ruleset=节点选择,[]IP-CIDR6,2606:4700:4700::1111/128,no-resolve
ruleset=节点选择,[]IP-CIDR6,2606:4700:4700::1001/128,no-resolve
ruleset=节点选择,[]IP-CIDR6,2001:4860:4860::8888/128,no-resolve
ruleset=节点选择,[]IP-CIDR6,2001:4860:4860::8844/128,no-resolve
ruleset=节点选择,[]DOMAIN-SUFFIX,cloudflare-dns.com
ruleset=节点选择,[]DOMAIN-SUFFIX,dns.google
ruleset=节点选择,[]DOMAIN-SUFFIX,quad9.net

# --- 第 2 优先级：广告拦截 + HTTPDNS 拦截 ---
# 【已精简】原 4 个广告源合计约 40 万条、重叠度极高，是启动慢的主因。
# 现只保留 anti-AD（中文环境覆盖最好）+ GEOSITE（零下载成本）。
ruleset=广告拦截,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/BlockHttpDNS/BlockHttpDNS.list
ruleset=广告拦截,https://cdn.jsdelivr.net/gh/privacy-protection-tools/anti-AD/master/anti-ad-domains.txt
ruleset=广告拦截,[]GEOSITE,category-ads-all
ruleset=广告拦截,https://raw.githubusercontent.com/loganoxo/thisrule/refs/heads/master/rule/LoganReject/Clash/LoganReject.list
ruleset=广告拦截,[]DOMAIN-SUFFIX,mcdn.bilivideo.com
ruleset=广告拦截,[]DOMAIN-SUFFIX,mcdn.bilivideo.cn
ruleset=广告拦截,[]DOMAIN-SUFFIX,szbdyd.com
ruleset=广告拦截,[]DOMAIN-SUFFIX,mountaintoys.cn

# --- 第 3 优先级：核心国际应用分流 ---
# AI 服务
ruleset=ChatGPT,https://raw.githubusercontent.com/loganoxo/thisrule/refs/heads/master/rule/AI/Clash/AI.list
ruleset=ChatGPT,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-chat-!cn.mrs

# Telegram（删除 geosite/telegram.mrs，ACL4SSR 已覆盖域名层）
ruleset=电报消息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/Telegram.list
ruleset=电报消息,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.mrs,no-resolve

# YouTube（loganoxo 版含 184 条，已覆盖原先的 youtube.mrs 和 5 条手写规则）
ruleset=油管视频,https://raw.githubusercontent.com/loganoxo/thisrule/refs/heads/master/rule/YouTube/Clash/YouTube.list
ruleset=油管视频,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/youtube.mrs,no-resolve

# Netflix
ruleset=奈飞视频,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/netflix.mrs
ruleset=奈飞视频,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/netflix.mrs,no-resolve

# TikTok
# 【已移除】geo/geoip/tiktok.mrs —— 该文件可能不存在（MetaCubeX 的 geoip 只覆盖国家和少数公司）。
# 若你验证过 URL 能打开，可自行加回。
ruleset=TikTok,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/tiktok.mrs

# Google 服务
ruleset=节点选择,https://raw.githubusercontent.com/loganoxo/thisrule/refs/heads/master/rule/Google/Clash/Google.list
ruleset=节点选择,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/google.mrs,no-resolve

# 苹果服务
# 该组默认 DIRECT，行为与直连一致。注意：整组切到"节点选择"会让 push.apple.com
# 也走代理，可能掉推送——切 App Store 地区建议单独加规则，别整组切。
ruleset=苹果服务,https://raw.githubusercontent.com/loganoxo/thisrule/refs/heads/master/rule/Apple/Clash/Apple.list
ruleset=苹果服务,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple-cn.mrs

# 网络测速
ruleset=节点选择,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/ookla-speedtest.mrs

# 香港流媒体
ruleset=香港流媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/Ruleset/MyTVSuper.list
ruleset=香港流媒体,[]DOMAIN-KEYWORD,tvb

# --- 第 4 优先级：直连补充层 ---
# 【已调整位置】把 DirectGlobal 和 LoganDirect 合并到这里，与国内识别相邻，语义更清晰
ruleset=全球直连,https://raw.githubusercontent.com/loganoxo/thisrule/refs/heads/master/rule/DirectGlobal/Clash/DirectGlobal.list
ruleset=全球直连,https://raw.githubusercontent.com/loganoxo/thisrule/refs/heads/master/rule/LoganDirect/Clash/LoganDirect.list

# --- 第 5 优先级：中国大陆流量识别 ---
# 【已精简】删除 China.list（ChinaMax 是其超集）
ruleset=全球直连,https://raw.githubusercontent.com/loganoxo/thisrule/refs/heads/master/rule/ChinaMax/Clash/ChinaMax.list
ruleset=全球直连,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs
ruleset=全球直连,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs,no-resolve

# --- 第 6 优先级：国际代理兜底 ---
ruleset=节点选择,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/gfw.mrs
ruleset=节点选择,https://raw.githubusercontent.com/loganoxo/thisrule/refs/heads/master/rule/Global/Clash/Global.list
ruleset=节点选择,https://raw.githubusercontent.com/loganoxo/thisrule/refs/heads/master/rule/LoganProxy/Clash/LoganProxy.list
ruleset=节点选择,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs

# --- 第 7 优先级：最终兜底 ---
ruleset=漏网之鱼,[]FINAL

# ========================
# 策略组部分
# ========================
custom_proxy_group=节点选择`select`[]香港负载`[]自动选择`[]故障转移`[]AWS香港负载`[]AWS台湾负载`[]wawo`[]新加坡负载`[]美国负载`[]AWS东京负载`[]DIRECT`.*
custom_proxy_group=油管视频`select`[]wawo`[]美国负载`[]AWS东京负载`[]AWS香港负载`[]AWS台湾负载`[]节点选择`[]新加坡负载`[]故障转移`[]DIRECT`.*
custom_proxy_group=香港流媒体`select`[]香港负载`[]wawo`[]AWS香港负载`[]节点选择`[]故障转移`.*
custom_proxy_group=ChatGPT`select`[]AWS台湾负载`[]美国负载`[]AWS东京负载`[]香港负载`[]新加坡负载`[]节点选择`[]自动选择`[]故障转移`[]DIRECT`.*
custom_proxy_group=TikTok`select`[]AWS台湾负载`[]美国负载`[]新加坡负载`[]节点选择`[]AWS东京负载`[]故障转移`.*
custom_proxy_group=奈飞视频`select`[]AWS台湾负载`[]新加坡负载`[]节点选择`[]美国负载`[]故障转移`.*
custom_proxy_group=电报消息`select`[]香港负载`[]新加坡负载`[]wawo`[]AWS香港负载`[]节点选择`[]自动选择`[]故障转移`.*
custom_proxy_group=自动选择`url-test`.*`https://www.cloudflare.com/cdn-cgi/trace`300,5,50
custom_proxy_group=故障转移`fallback`.*`https://www.cloudflare.com/cdn-cgi/trace`300,5,50
custom_proxy_group=香港负载`load-balance`(香港电视)`https://www.cloudflare.com/cdn-cgi/trace`300,5,50
custom_proxy_group=wawo`load-balance`(wawo)`https://www.cloudflare.com/cdn-cgi/trace`300,5,50
custom_proxy_group=新加坡负载`load-balance`(新加坡)`https://www.cloudflare.com/cdn-cgi/trace`300,5,50
custom_proxy_group=AWS香港负载`load-balance`(aws香港hy2)`https://www.cloudflare.com/cdn-cgi/trace`300,5,50
custom_proxy_group=AWS台湾负载`load-balance`(台湾)`https://www.cloudflare.com/cdn-cgi/trace`300,5,50
custom_proxy_group=AWS东京负载`load-balance`(东京)`https://www.cloudflare.com/cdn-cgi/trace`300,5,50
custom_proxy_group=美国负载`load-balance`(洛杉矶)`https://www.cloudflare.com/cdn-cgi/trace`300,5,50
custom_proxy_group=苹果服务`select`[]DIRECT`[]节点选择`[]自动选择
custom_proxy_group=广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=全球直连`select`[]DIRECT`[]节点选择
custom_proxy_group=漏网之鱼`select`[]节点选择`[]DIRECT`[]自动选择`[]故障转移`.*

# ========================
# 规则生成器设置
# ========================
enable_rule_generator=true
overwrite_original_rules=true
