ruleset=奈飞视频,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/netflix.mrs
ruleset=奈飞视频,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/netflix.mrs,no-resolve

# TikTok（使用权威 Geosite 规则集）
ruleset=TikTok,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/tiktok.mrs

# Google 服务（使用权威 Geosite + GeoIP 规则集）
ruleset=节点选择,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.mrs
ruleset=节点选择,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/google.mrs,no-resolve

# GitHub（使用权威 Geosite 规则集）
ruleset=节点选择,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/github.mrs

# Microsoft（使用权威 Geosite 规则集）
ruleset=节点选择,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.mrs

# OneDrive（使用权威 Geosite 规则集）
ruleset=节点选择,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/onedrive.mrs

# PayPal（使用权威 Geosite 规则集）
ruleset=节点选择,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/paypal.mrs

# 苹果服务（使用权威 Geosite 规则集，中国区专用）
ruleset=全球直连,https://raw.githubusercontent.com/loganoxo/thisrule/refs/heads/master/rule/Apple/Clash/Apple.list
ruleset=全球直连,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple-cn.mrs


# 网络测速（使用权威 Geosite 规则集）
ruleset=节点选择,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/ookla-speedtest.mrs

# 香港流媒体（保留手动规则）
ruleset=香港流媒体,[]DOMAIN-KEYWORD,tvb

# === 第 4 优先级：中国大陆流量识别（核心）===
# 4.1 使用权威每日更新列表，确保准确性和时效性。
ruleset=全球直连,https://raw.githubusercontent.com/loganoxo/thisrule/refs/heads/master/rule/China/Clash/China.list
ruleset=全球直连,https://raw.githubusercontent.com/loganoxo/thisrule/refs/heads/master/rule/ChinaMax/Clash/ChinaMax.list
ruleset=全球直连,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs
ruleset=全球直连,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs,no-resolve


# 4.2 GFW 列表（使用权威 Geosite 规则集）
ruleset=节点选择,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/gfw.mrs

# 4.3 非中国地理位置（使用权威 Geosite 规则集）
ruleset=节点选择,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs

# === 第 5 优先级：自定义规则集 ===
# 此部分用于补充权威列表未覆盖的站点，或进行特定站点的分流。
ruleset=全球直连,https://ghfast.top/https://github.com/liandu2024/clash/raw/refs/heads/main/list/Direct.list
ruleset=节点选择,https://ghfast.top/https://github.com/liandu2024/clash/raw/refs/heads/main/list/Proxy.list
ruleset=节点选择,https://ghfast.top/https://github.com/blackmatrix7/ios_rule_script/raw/refs/heads/master/rule/Clash/Global/Global.list
ruleset=节点选择,https://ghfast.top/https://github.com/liandu2024/clash/raw/refs/heads/main/list/Check.list

# === 第 6 优先级：最终兜底规则 ===
# 经过以上所有规则，剩余流量极少，导向"漏网之鱼"策略组进行最终决策。
ruleset=漏网之鱼,[]FINAL

